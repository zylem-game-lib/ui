name: API report

on:
  push:
  pull_request:

jobs:
  api-extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:check
      - run: pnpm test
      - run: pnpm showcase:build
      - run: pnpm api:extract
